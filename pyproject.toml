[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge0-intel"
version = "3.16.0"
description = "Tensor Shard Evolution & GGUF Surgery — Meta-evolution over tensor shards: populations of model builds, surgery operators as mutations, functional fitness (refusal + caps), ledger of every run, champions served."
readme = "README.md"
license = {text = "SOUL FORGE v1.0"}
authors = [{name = "myzticalbabe", email = "myzticalbabe@proton.me"}]
maintainers = [{name = "myzticalbabe"}]
keywords = ["ml", "evolution", "gguf", "ablation", "refusal-direction", "tensor-surgery", "model-surgery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.14"
dependencies = [
    "transformers>=4.45",
    "accelerate>=0.34",
    "safetensors>=0.4",
    "gguf>=0.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "requests>=2.32",
    "rich>=13.9",
    "typer>=0.12",
    "llama-cpp-python>=0.3.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "black>=24.10",
    "ruff>=0.7",
    "mypy>=1.11",
]
cuda = [
    "torch>=2.5",
]
opencl = [
    "torch>=2.5",
    "pyopencl>=2024.2",
]
cpu = [
    "torch>=2.5",
]

[project.urls]
Homepage = "https://github.com/myzticalbabe/edge0-intel"
Repository = "https://github.com/myzticalbabe/edge0-intel"
Issues = "https://github.com/myzticalbabe/edge0-intel/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["edge0_intel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py314"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH"]
ignore = ["E501", "PTH123"]